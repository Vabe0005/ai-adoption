<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="bt bd">
  <title id="bt">One bulb in eight</title>
  <desc id="bd">Eight light bulbs hang from a ceiling. Only one is switched on and glowing purple: about 1 in 8 Australian businesses use AI.</desc>
  <defs>
    <radialGradient id="bglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a3fd6" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#6a3fd6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6a3fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a3fd6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6a3fd6" stop-opacity="0"/>
    </linearGradient>
    <!-- one unlit bulb, drawn at the origin -->
    <g id="off">
      <rect x="-6" y="-10" width="12" height="10" rx="2" fill="#cfc8e3"/>
      <path d="M -6 0 C -6 6, -15 10, -15 21 A 15 15 0 0 0 15 21 C 15 10, 6 6, 6 0 Z" fill="#f4f2f8" stroke="#cfc8e3" stroke-width="2"/>
    </g>
  </defs>

  <!-- ceiling -->
  <rect x="10" y="14" width="400" height="6" rx="3" fill="#1e1b2e"/>

  <!-- cords -->
  <g stroke="#9c95ad" stroke-width="1.5">
    <line x1="38"  y1="20" x2="38"  y2="88"/>
    <line x1="86"  y1="20" x2="86"  y2="128"/>
    <line x1="134" y1="20" x2="134" y2="70"/>
    <line x1="182" y1="20" x2="182" y2="112"/>
    <line x1="238" y1="20" x2="238" y2="146"/>
    <line x1="286" y1="20" x2="286" y2="80"/>
    <line x1="334" y1="20" x2="334" y2="120"/>
    <line x1="382" y1="20" x2="382" y2="96"/>
  </g>

  <!-- the lit bulb's beam and pool of light -->
  <path d="M 226 186 L 172 300 L 304 300 L 250 186 Z" fill="url(#beam)"/>
  <ellipse cx="238" cy="302" rx="70" ry="9" fill="#6a3fd6" opacity="0.18"/>
  <circle cx="238" cy="170" r="64" fill="url(#bglow)"/>

  <!-- unlit bulbs -->
  <use href="#off" x="38"  y="98"/>
  <use href="#off" x="86"  y="138"/>
  <use href="#off" x="134" y="80"/>
  <use href="#off" x="182" y="122"/>
  <use href="#off" x="286" y="90"/>
  <use href="#off" x="334" y="130"/>
  <use href="#off" x="382" y="106"/>

  <!-- lit bulb -->
  <g transform="translate(238,156)">
    <rect x="-6" y="-10" width="12" height="10" rx="2" fill="#1e1b2e"/>
    <path d="M -6 0 C -6 6, -15 10, -15 21 A 15 15 0 0 0 15 21 C 15 10, 6 6, 6 0 Z" fill="#6a3fd6" stroke="#4b2aa0" stroke-width="2"/>
    <path d="M -5 15 C -5 23, 5 23, 5 15" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floor -->
  <line x1="10" y1="302" x2="410" y2="302" stroke="#d8d3e3" stroke-width="2"/>

  <!-- caption -->
  <text x="210" y="332" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#4b2aa0" letter-spacing="0.5">ABOUT 1 IN 8 SWITCHED ON</text>
  <text x="210" y="351" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#4a4458">The other 7 in 8 businesses don’t use AI yet</text>
</svg>
